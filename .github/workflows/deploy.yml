name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # daily at 06:17 Lahore time: picks up new Substack posts
  workflow_dispatch:

# Read-only by default. Each job below asks only for what it needs, so the build
# (which installs packages and runs their install scripts) never holds write access.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  IBM_TELEMETRY_DISABLED: 'true' # stops IBM's packages reporting install statistics

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized pictures are kept between runs, so a build takes seconds instead of minutes.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-images-
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off daily runs in a repository with no commits for 60 days.
  # Re-enabling the workflow on each daily run resets that clock. No code is checked out or installed here.
  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily rebuild switched on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
